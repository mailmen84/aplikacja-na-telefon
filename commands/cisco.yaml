title: Cisco IOS quick reference
defaults:
  category: cisco
  platform: cisco
groups:
  - name: Modes & saving
    defaults: { tags: [ios, modes, save] }
    commands:
      - { cmd: "enable", desc: "User EXEC → privileged EXEC (>  to  #)" }
      - { cmd: "configure terminal", desc: "Enter global config mode (conf t)" }
      - { cmd: "end", desc: "Jump back to privileged EXEC (or Ctrl+Z)" }
      - { cmd: "copy running-config startup-config", desc: "Save the config to NVRAM (survives reboot)" }
      - { cmd: "write memory", desc: "Save config — old-style shortcut (wr)" }
      - { cmd: "show running-config", desc: "Show the live config (sh run)" }
      - { cmd: "reload", desc: "Reboot the device", danger: "Interrupts the network; warns if there are unsaved changes." }
      - { cmd: "erase startup-config", desc: "Wipe the saved config (clean slate on next boot)", danger: "Erases the saved configuration." }
  - name: Verify / show
    defaults: { tags: [show, verify, troubleshooting] }
    commands:
      - { cmd: "show ip interface brief", desc: "Every interface: IP + up/down (sh ip int br) — start here" }
      - { cmd: "show interfaces status", desc: "Switch ports: state, speed, VLAN" }
      - { cmd: "show vlan brief", desc: "VLANs and which ports are in them" }
      - { cmd: "show interfaces trunk", desc: "Trunk links, allowed and native VLANs" }
      - { cmd: "show mac address-table", desc: "Which MAC is learned on which port" }
      - { cmd: "show ip route", desc: "The routing table (router)" }
      - { cmd: "show cdp neighbors detail", desc: "Directly connected Cisco devices (names, IPs, ports)" }
      - { cmd: "show version", desc: "IOS version, uptime, model, serial" }
      - { cmd: "show run | include ip route", desc: "Filter the config to matching lines" }
  - name: Switch config
    defaults: { tags: [switch, vlan, trunk, port] }
    commands:
      - { cmd: "vlan 10", desc: "Create/enter VLAN 10 (then: name HR)" }
      - { cmd: "switchport mode access", desc: "Make a port an access port" }
      - { cmd: "switchport access vlan 10", desc: "Put the access port in VLAN 10" }
      - { cmd: "switchport mode trunk", desc: "Make a port a trunk (carries many VLANs)" }
      - { cmd: "switchport trunk allowed vlan 10,20,99", desc: "Restrict which VLANs the trunk carries" }
      - { cmd: "interface range fa0/1 - 8", desc: "Configure a range of ports at once" }
      - { cmd: "spanning-tree portfast", desc: "End-device port goes active instantly", note: "Only on ports to hosts, never to another switch." }
      - { cmd: "switchport port-security mac-address sticky", desc: "Learn and lock the port to its device's MAC" }
  - name: Router config
    defaults: { tags: [router, routing, interface] }
    commands:
      - { cmd: "ip address 192.168.1.1 255.255.255.0", desc: "Set an interface IP (in interface config)" }
      - { cmd: "no shutdown", desc: "Enable an interface (required — they start shut)" }
      - { cmd: "ip route 10.10.0.0 255.255.0.0 203.0.113.1", desc: "Add a static route" }
      - { cmd: "ip route 0.0.0.0 0.0.0.0 203.0.113.1", desc: "Add a default route (gateway of last resort)" }
      - { cmd: "encapsulation dot1Q 10", desc: "Tag a subinterface for VLAN 10 (router-on-a-stick)" }
      - { cmd: "ip nat inside source list 1 interface g0/1 overload", desc: "PAT — share one public IP for the LAN" }
  - name: Secure access (SSH)
    defaults: { tags: [ssh, security, password] }
    commands:
      - { cmd: "enable secret StrongP@ss", desc: "Set an encrypted privileged-mode password" }
      - { cmd: "service password-encryption", desc: "Obscure plain-text passwords in the config" }
      - { cmd: "crypto key generate rsa modulus 2048", desc: "Generate the RSA key SSH needs" }
      - { cmd: "transport input ssh", desc: "Allow SSH only on the VTY lines (no Telnet)", note: "Set under: line vty 0 4" }
      - { cmd: "undebug all", desc: "Turn off all debugging (u all)", note: "Always run after any debug command." }
